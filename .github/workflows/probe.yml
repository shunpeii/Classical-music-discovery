name: Probe concert sources
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/probe_sources.py
      - scripts/validate_nhk.py
      - scripts/validate_sites.py
      - scripts/candidates.json
      - .github/workflows/probe.yml
concurrency:
  group: probe-concert-sources-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/requirements.txt ruff
      - run: ruff check scripts/probe_sources.py
      - run: python scripts/probe_sources.py
      - run: ruff check scripts/validate_nhk.py
      - run: python scripts/validate_nhk.py
      - run: ruff check scripts/validate_sites.py
      - run: python scripts/validate_sites.py
      - name: Commit diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/diagnostics/latest.json scripts/diagnostics/nhk-validation.json scripts/diagnostics/sites-validation.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update source diagnostics'
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              if git push origin HEAD:main; then
                exit 0
              fi
              sleep 3
            done
            exit 1
          fi
