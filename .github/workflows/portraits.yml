name: Fetch composer portraits
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch_portraits.py
      - scripts/portrait_sources.json
      - .github/workflows/portraits.yml
permissions:
  contents: write
jobs:
  portraits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch portraits
        id: fetch
        continue-on-error: true
        run: python scripts/fetch_portraits.py
      - name: Commit downloaded images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/master/composers.json public/images/composers
          if ! git diff --cached --quiet; then
            git commit -m "data: import licensed composer portraits"
            git push
          fi
      - name: Check completeness
        if: steps.fetch.outcome != 'success'
        run: exit 1
