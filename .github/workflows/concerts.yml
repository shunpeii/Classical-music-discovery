name: Refresh concerts
on:
  schedule:
    - cron: '20 18 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: concerts-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r scripts/requirements.txt ruff
      - run: ruff check --select E9,F63,F7,F82 scripts
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: npm install
      - run: npm run check
      - name: Refresh approved sources
        run: |
          if python -c 'import json,sys; sys.exit(not any(s.get("approved") for s in json.load(open("scripts/sources.json"))))'; then
            python scripts/scrape.py
          else
            echo "::warning::No approved concert sources; skipping refresh"
          fi
      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/concerts
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh concert snapshot'
            git push
          fi
