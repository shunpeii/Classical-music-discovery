name: Refresh concerts
on:
  schedule:
    - cron: '0 18 28-31 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: concerts-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check monthly date
        id: calendar
        run: |
          if [ '${{ github.event_name }}' = workflow_dispatch ] || [ "$(TZ=Asia/Tokyo date +%d)" = 01 ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.calendar.outputs.run == 'true'
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: steps.calendar.outputs.run == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: steps.calendar.outputs.run == 'true'
        with:
          node-version: '22'
      - if: steps.calendar.outputs.run == 'true'
        run: pip install -r scripts/requirements.txt ruff
      - if: steps.calendar.outputs.run == 'true'
        run: ruff check --select E9,F63,F7,F82 scripts
      - if: steps.calendar.outputs.run == 'true'
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - if: steps.calendar.outputs.run == 'true'
        run: npm install
      - if: steps.calendar.outputs.run == 'true'
        run: npm run check
      - name: Refresh validated adapters
        if: steps.calendar.outputs.run == 'true'
        run: |
          python scripts/validate_nhk.py || python -c 'import json; from pathlib import Path; Path("scripts/diagnostics/nhk-validation.json").write_text(json.dumps({"error":"NHK refresh failed"}))'
          python scripts/validate_sites.py
          python scripts/publish_concerts.py
      - name: Commit snapshot
        if: steps.calendar.outputs.run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/concerts
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh concert snapshot'
            git restore -- scripts/diagnostics/nhk-validation.json scripts/diagnostics/sites-validation.json
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
